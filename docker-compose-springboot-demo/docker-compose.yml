services:
  app-db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  app-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-service
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://app-db:5432/demo_db
      DB_USERNAME: demo_user
      DB_PASSWORD: demo_pass
    ports:
      - "8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
